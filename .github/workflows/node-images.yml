name: node-images

# Builds the Litecoin Node, Dogecoin Node and Pepecoin Node images (amd64 + arm64) from the
# official release binaries (checksums and signatures are verified inside
# the build, see nodes/*/Dockerfile) and the app's status page
# (cmd/nodestatus, nodes/status/Dockerfile) for the Litecoin + Dogecoin Node
# app, and pushes them to
# ghcr.io/fladnagmai/litecoin-node, dogecoin-node, pepecoin-node and node-status.
on:
  push:
    branches: [node-rollout]
    paths: ["nodes/**", "cmd/nodestatus/**", "internal/nodestatus/**", "internal/node/**", ".github/workflows/node-images.yml"]
  workflow_dispatch:
    inputs:
      only:
        description: "Build only this image (e.g. wizard-blocks-view); empty = all"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

# version: the release built (passed as VERSION); tag: the image tag (-wbN
# marks a rebuild of the same release with changes of ours, e.g. memwrap).
jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - name: litecoin-node
            context: nodes
            file: nodes/litecoin/Dockerfile
            version: 0.21.5.8
            tag: 0.21.5.8-wb2
          - name: dogecoin-node
            context: nodes
            file: nodes/dogecoin/Dockerfile
            version: 1.14.9
            tag: 1.14.9-wb2
          - name: pepecoin-node
            context: nodes
            file: nodes/pepecoin/Dockerfile
            version: 1.1.0
            tag: 1.1.0
          - name: wizard-blocks-view
            context: .
            file: view/Dockerfile
            version: 1.0.0-beta
            tag: 1.0.0-beta
          - name: node-status
            context: .
            file: nodes/status/Dockerfile
            version: 1.0.0-beta
            tag: 1.0.0-beta
    steps:
      - if: (github.event.inputs.only == '' || github.event.inputs.only == null || github.event.inputs.only == matrix.name)
        uses: actions/checkout@v4
      - if: (github.event.inputs.only == '' || github.event.inputs.only == null || github.event.inputs.only == matrix.name) && (matrix.name == 'node-status' || matrix.name == 'wizard-blocks-view')
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.7"
      - if: (github.event.inputs.only == '' || github.event.inputs.only == null || github.event.inputs.only == matrix.name) && (matrix.name == 'node-status')
        run: go test ./internal/node/... ./internal/nodestatus/... ./cmd/nodestatus/...
      - if: (github.event.inputs.only == '' || github.event.inputs.only == null || github.event.inputs.only == matrix.name) && (matrix.name == 'wizard-blocks-view')
        run: go test ./internal/poolview/... ./internal/ui/...
      - if: (github.event.inputs.only == '' || github.event.inputs.only == null || github.event.inputs.only == matrix.name)
        uses: docker/setup-qemu-action@v3
      - if: (github.event.inputs.only == '' || github.event.inputs.only == null || github.event.inputs.only == matrix.name)
        uses: docker/setup-buildx-action@v3
      - if: (github.event.inputs.only == '' || github.event.inputs.only == null || github.event.inputs.only == matrix.name)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: (github.event.inputs.only == '' || github.event.inputs.only == null || github.event.inputs.only == matrix.name)
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ matrix.version }}
          tags: ghcr.io/fladnagmai/${{ matrix.name }}:${{ matrix.tag }}
          labels: org.opencontainers.image.source=https://github.com/fladnagmai/Wizard-Blocks
      - if: (github.event.inputs.only == '' || github.event.inputs.only == null || github.event.inputs.only == matrix.name)
        name: Digest to pin
        run: echo "ghcr.io/fladnagmai/${{ matrix.name }}:${{ matrix.tag }}@${{ steps.push.outputs.digest }}" | tee -a "$GITHUB_STEP_SUMMARY"
