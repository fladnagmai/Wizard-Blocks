name: node-images

# Builds the Litecoin Node, Dogecoin Node and Pepecoin Node images (amd64 + arm64) from the
# official release binaries (checksums and signatures are verified inside
# the build, see nodes/*/Dockerfile) and the app's status page
# (cmd/nodestatus, nodes/status/Dockerfile) for the Litecoin + Dogecoin Node
# app, and pushes them to
# ghcr.io/fladnagmai/litecoin-node, dogecoin-node, pepecoin-node and node-status.
on:
  push:
    branches: [node-rollout]
    paths: ["nodes/**", "cmd/nodestatus/**", "internal/nodestatus/**", "internal/node/**", ".github/workflows/node-images.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# version: the release built (passed as VERSION); tag: the image tag (-wbN
# marks a rebuild of the same release with changes of ours, e.g. memwrap).
jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - name: litecoin-node
            context: nodes
            file: nodes/litecoin/Dockerfile
            version: 0.21.5.8
            tag: 0.21.5.8-wb2
          - name: dogecoin-node
            context: nodes
            file: nodes/dogecoin/Dockerfile
            version: 1.14.9
            tag: 1.14.9-wb2
          - name: pepecoin-node
            context: nodes
            file: nodes/pepecoin/Dockerfile
            version: 1.1.0
            tag: 1.1.0
          - name: node-status
            context: .
            file: nodes/status/Dockerfile
            version: 0.3.0
            tag: 0.3.0
    steps:
      - uses: actions/checkout@v4
      - if: matrix.name == 'node-status'
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.7"
      - if: matrix.name == 'node-status'
        run: go test ./internal/node/... ./internal/nodestatus/... ./cmd/nodestatus/...
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ matrix.version }}
          tags: ghcr.io/fladnagmai/${{ matrix.name }}:${{ matrix.tag }}
          labels: org.opencontainers.image.source=https://github.com/fladnagmai/Wizard-Blocks
      - name: Digest to pin
        run: echo "ghcr.io/fladnagmai/${{ matrix.name }}:${{ matrix.tag }}@${{ steps.push.outputs.digest }}" | tee -a "$GITHUB_STEP_SUMMARY"
