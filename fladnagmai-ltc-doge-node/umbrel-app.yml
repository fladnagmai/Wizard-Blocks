category: bitcoin
name: Litecoin + Dogecoin Node
version: "1.1.1-beta"
tagline: Pruned Litecoin Core, Dogecoin Core and Pepecoin Core nodes in one app, with a live status page
icon: https://raw.githubusercontent.com/fladnagmai/Wizard-Blocks/main/fladnagmai-ltc-doge-node/icon.svg
description: >-
  Litecoin Core v0.21.5.8, Dogecoin Core v1.14.9 and Pepecoin Core v1.1.0 in
  one app, built from the official release binaries (each build checks the
  release signature and the checksum). All nodes are pruned with txindex off
  and memory settings sized for a shared Umbrel: Litecoin cache 300 MiB,
  Dogecoin cache 200 MiB, Pepecoin cache 100 MiB; mempool 100 MiB and 24 peers
  (Pepecoin 50 MiB and 16 peers).


  The app page shows every node live on one page: synced or sync progress,
  height and headers, time since the last block, peers, mempool, difficulty,
  disk use, memory use and version. Buttons pause or resume the Dogecoin and
  Pepecoin syncs, so the Litecoin node can have the bandwidth and disk while
  it syncs (a pause is kept across restarts; that chain's merged mining is
  off while it is paused). Each node's prune target can be changed there too
  (Litecoin 550 MiB to 20 GB, Dogecoin and Pepecoin 2200 MiB to 20 GB;
  applying it restarts that node), and
  so can each node's database cache (up to 4 GB): raise it to speed up the
  first sync, then set it back once synced to free the memory.


  It exports the nodes' RPC and ZMQ details for Wizard-Blocks-LTC (Litecoin
  mining with Dogecoin and Pepecoin merged mining). The first sync downloads
  every chain once even though they are pruned; on a home connection that
  takes days.
releaseNotes: >-
  Beta.
