version: "3.7"

services:
  app_proxy:
    environment:
      # The same page inside Umbrel (dashboard port 8432, Umbrel login).
      APP_HOST: fladnagmai-wizard-blocks-view_web_1
      APP_PORT: 8431

  web:
    # The public view (cmd/poolview, view/Dockerfile): reads each pool app's
    # state and serves it view-only, without payout addresses or settings.
    image: ghcr.io/fladnagmai/wizard-blocks-view:1.0.0-beta@sha256:c62a401a931de34823a5a7a94ad3e0fdfb7321f0ff0a505769aade00cfe86fb8
    user: "1000:1000"
    restart: on-failure
    read_only: true
    environment:
      PV_LISTEN: 0.0.0.0:8431
      # The pool apps' web UIs on Umbrel's network (<app-id>_engine_1:8420).
      PV_BCH_URL: http://fladnagmai-wizard-blocks_engine_1:8420
      PV_LTC_URL: http://fladnagmai-wizard-blocks-ltc_engine_1:8420
      PV_BTC_URL: http://fladnagmai-wizard-blocks-btc_engine_1:8420
    ports:
      # The public page: forward this port on your router to open it from
      # anywhere (http://<your public IP>:8431).
      - "8431:8431"
