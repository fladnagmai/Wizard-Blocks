id: fladnagmai-wizard-blocks-ltc
category: crypto
name: Wizard-Blocks³
version: "1.0.0-beta"
tagline: Solo-mine Litecoin and merge-mine Dogecoin and Pepecoin on your own nodes
icon: https://raw.githubusercontent.com/fladnagmai/Wizard-Blocks/main/fladnagmai-wizard-blocks-ltc/icon.svg
description: >-
  Wizard-Blocks³ is a self-hosted solo-mining Stratum V1
  server for Litecoin with Dogecoin and Pepecoin merged mining: every share
  is checked against every chain, so one Scrypt miner mines LTC, DOGE and
  PEP at once. It talks to your Litecoin + Dogecoin Node app over RPC and
  ZMQ, and 100% of every block reward goes to your own payout addresses.


  Point your Scrypt miner (e.g. Elphapex DG Home 1) at umbrel.local:50333.
  The web UI is one stats page for all chains: each chain, node, pool,
  miners, blocks and settings.


  On first run, open the app and set your LTC payout address (and DOGE and
  PEP addresses to also mine Dogecoin and Pepecoin); your nodes check them. No work is issued
  to miners until the LTC address is set.


  The page shows a block check: your Litecoin node validates the full block
  each new job would produce (everything except the proof of work), so you
  can see real blocks are being built correctly before one is found.

