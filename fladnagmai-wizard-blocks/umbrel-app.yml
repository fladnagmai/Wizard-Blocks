manifestVersion: 1
id: fladnagmai-wizard-blocks
category: crypto
name: Wizard-Blocks-BCH
version: "0.0.1-beta"
tagline: Solo-mine Bitcoin Cash on your own node
icon: https://raw.githubusercontent.com/fladnagmai/Wizard-Blocks/main/fladnagmai-wizard-blocks/icon.svg
description: >-
  Wizard-Blocks is a self-hosted solo-mining Stratum V1 server for Bitcoin Cash.
  It talks to your Bitcoin Cash Node app over RPC and ZMQ, and 100% of every
  block reward plus fees goes to your own payout address.


  Point your Bitaxe, NerdQaxe or ASIC at umbrel.local:62023. The web UI is a
  single stats page: node, pool, workers, block chance, found blocks and
  settings.


  On first run, open the app and set your CashAddr payout address in
  Settings. No work is issued to miners until it is set and
  verified by your node. Settings are open to anyone logged into Umbrel; you
  can add an optional settings password there.
